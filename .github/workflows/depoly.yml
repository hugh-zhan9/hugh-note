name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

# All site publishers share this group. Pending older runs fail the main-head gate.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/running/pnpm-lock.yaml
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Install running dependencies
        run: pnpm --dir apps/running install --frozen-lockfile
      - name: Verify
        run: |
          bash tests/homepage_contract_test.sh
          bash tests/crazy_talk_section_test.sh
          node --test tests/skin_test.cjs tests/site_build_test.mjs tests/running_route_test.cjs tests/site_workflow_test.mjs
          pnpm --dir apps/running test
          pnpm --dir apps/running exec tsc --noEmit
      - name: Build both applications
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: node scripts/build.mjs
      - name: Check current main before publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: head
        run: bash scripts/check-publish-head.sh >> "$GITHUB_OUTPUT"
      - name: Publish complete site
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: hugh-zhan9/hugh-zhan9.github.io
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./dist/site
          publish_branch: main

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/running/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pytest textual
        working-directory: apps/running
      - run: python -m pytest test_tui_app.py run_page/test_keep_sync.py run_page/test_generator.py run_page/gpxtrackposter/test_track.py -q
        working-directory: apps/running
