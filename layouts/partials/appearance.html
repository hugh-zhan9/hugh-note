<details class="skin-settings" id="skin-settings" hidden>
	<summary aria-label="外观设置" title="外观设置">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
			<circle cx="12" cy="12" r="9" />
			<path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" />
		</svg>
	</summary>
	<div class="skin-panel">
<label for="skin-preset">预设主题</label>
<select id="skin-preset">
	<option value="light">素纸 · 默认</option>
	<option value="paper">暖纸</option>
	<option value="sage">鼠尾草</option>
	<option value="dark">夜幕</option>
	<option value="custom">自定义</option>
</select>
<label for="skin-color">自定义背景色</label>
<div class="skin-color-row">
	<input id="skin-color" type="color" value="#faf9f6">
	<input id="skin-hex" type="text" value="#faf9f6" aria-label="背景色十六进制色值" aria-describedby="skin-status" maxlength="7" pattern="#[0-9a-fA-F]{6}" spellcheck="false" autocomplete="off">
</div>
<p id="skin-status" role="status">选择自动保存在此浏览器，应用于全站。</p>
<button id="skin-reset" type="button">恢复默认</button>
	</div>
</details>
